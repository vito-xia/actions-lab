name: Hello Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    name: Hello from GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Say hello and show the runner
        run: |
          echo "Hello, GitHub Actions is working!"
          echo "Triggered by: $GITHUB_EVENT_NAME"
          echo "Repository:   $GITHUB_REPOSITORY"
          echo "Actor:        $GITHUB_ACTOR"
          echo "UTC time:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "--- Runner ---"
          uname -a
          python3 --version
          node --version || true

      - name: Do a small real task
        run: |
          python3 - <<'PY'
          total = sum(range(1, 101))
          print(f"sum 1..100 = {total}")
          assert total == 5050
          print("check passed")
          PY

      - name: Write job summary
        run: |
          echo "## GitHub Actions OK" >> "$GITHUB_STEP_SUMMARY"
          echo "First successful workflow run for vito-xia." >> "$GITHUB_STEP_SUMMARY"
